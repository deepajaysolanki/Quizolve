<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizolve Subscription Inquiry</title>
    <style>
        /* 1. Global Reset: Ensures padding doesn't affect width/height calculations */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            
            /* 2. Flexbox Centering: This targets the .content-wrapper */
            display: flex;
            justify-content: center; /* Horizontal centering */
            align-items: center;     /* Vertical centering */
            min-height: 100vh;       /* Full viewport height */
            padding: 20px;           /* Breathing room for mobile */
        }

        .content-wrapper {
            background: white;
            border: 1px solid #d1d1d1;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            
            /* 3. Responsive Width */
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .email-link {
            font-weight: bold;
            color: #0066cc;
            text-decoration: none;
            border-bottom: 1px solid #0066cc;
            /* Prevents long emails from breaking the box on small screens */
            word-break: break-all; 
            transition: all 0.2s ease;
            display: inline-block;
        }

        .email-link:hover {
            color: #004499;
            border-bottom: 2px solid #004499;
            transform: translateY(-1px);
        }

        /* 4. Mobile Adjustments */
        @media (max-width: 480px) {
            .content-wrapper {
                padding: 30px 20px;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <p>For all inquiries regarding <strong>Quizolve subscriptions</strong>, please reach out to our administration team at the following address:</p>
        
        <a href="mailto:deepsolanki9125@gmail.com" class="email-link">
            deepsolanki9125@gmail.com
        </a>
    </div>

</body>
</html>
