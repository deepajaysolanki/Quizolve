{% extends "base.html" %}
{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 5rem auto; padding: 2rem; background: var(--card-dark); border-radius: 1rem;">
    <h2 style="text-align: center;">Set New Password</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="password" name="password" placeholder="New Password" required style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 0.5rem; background: #222; color: white; border: 1px solid #444;">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 0.5rem; background: #222; color: white; border: 1px solid #444;">
        <button type="submit" class="btn-primary" style="width: 100%;">Change Password</button>
    </form>
</div>
{% endblock %}
