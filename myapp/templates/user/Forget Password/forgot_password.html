{% extends "base.html" %}
{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 5rem auto; padding: 2rem; background: var(--card-dark); border-radius: 1rem;">
    <h2 style="text-align: center;">Forgot Password</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label>Enter your Email</label>
            <input type="email" name="email" required style="width: 100%; padding: 0.8rem; border-radius: 0.5rem; background: #222; color: white; border: 1px solid #444;">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Send OTP</button>
    </form>
</div>
{% endblock %}
